<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Events | EventEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="navbar"></header>
<main>
  <section class="container"><h2>All Events</h2>
    <div class="filters">
      <input id="search" placeholder="Search events...">
      <select id="category"><option value="">All Categories</option></select>
      <input type="date" id="dateFilter">
      <select id="sort">
        <option value="date">Sort: Date</option>
        <option value="priceLow">Price: Low to High</option>
        <option value="priceHigh">Price: High to Low</option>
        <option value="seats">Most Seats</option>
      </select>
    </div>
    <div class="grid" id="eventGrid"></div>
    <p id="noResults" class="muted" hidden>No events match your filters.</p>
  </section>
</main>
<footer id="footer"></footer>
<script src="js/main.js"></script>
<script src="js/events.js"></script>
</body>
</html>
